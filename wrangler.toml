# wrangler.toml — used for D1 database commands (create / migrate / query).
# Sites are deployed with `npm run deploy -- --site <slug>` (see scripts/deploy.mjs).
# After `npx wrangler d1 create apexforge-leads`, paste the database_id below.
name = "apexforge"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "apexforge-leads"
database_id = "00000000-0000-0000-0000-000000000000"
